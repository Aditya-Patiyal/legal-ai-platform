[build]
  publish = "."

# Pretty routes → actual HTML files under /frontend
[[redirects]]
  from = "/"
  to = "/frontend/index.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/frontend/dashboard.html"
  status = 200

[[redirects]]
  from = "/chat"
  to = "/frontend/chat.html"
  status = 200

[[redirects]]
  from = "/generator"
  to = "/frontend/generator.html"
  status = 200

# API proxy → Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://athletic-wonder-production-ea72.up.railway.app/api/:splat"
  status = 200
  force = true
